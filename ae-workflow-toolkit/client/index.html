<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AE Workflow Toolkit</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e1e;
            color: #e0e0e0;
        }
        .panel-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #0078d4;
        }
        .section {
            margin-bottom: 25px;
        }
        .section-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #0078d4;
        }
        .btn {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            background: #0078d4;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .btn:hover {
            background: #005a9e;
        }
    </style>
</head>
<body>
    <div class="panel-header">AE Workflow Toolkit</div>
    
    <div class="section">
        <div class="section-title">Text Animation</div>
        <button class="btn" onclick="runScript('textFadeIn')">Fade In</button>
        <button class="btn" onclick="runScript('textTypeOn')">Type On</button>
        <button class="btn" onclick="runScript('textSlideIn')">Slide In</button>
    </div>
    
    <div class="section">
        <div class="section-title">Layer Management</div>
        <button class="btn" onclick="runScript('organizeLayers')">Organize Layers</button>
        <button class="btn" onclick="runScript('colorCode')">Color Code</button>
        <button class="btn" onclick="runScript('renameSequential')">Rename Sequential</button>
    </div>
    
    <div class="section">
        <div class="section-title">Camera Tools</div>
        <button class="btn" onclick="runScript('createCamera')">Create Camera</button>
        <button class="btn" onclick="runScript('cameraOrbit')">Camera Orbit</button>
    </div>

    <script>
        function runScript(scriptName) {
            var cs = new CSInterface();
            cs.evalScript('$.runScript("' + scriptName + '")');
        }
    </script>
    <script src="../node_modules/csinterface/CSInterface.js"></script>
</body>
</html>
